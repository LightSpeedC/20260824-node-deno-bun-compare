<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="起動系 4 項目の中央値を比較した横棒グラフ">
	<defs>
		<linearGradient id="g-node" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="#1a4ea8"/><stop offset="1" stop-color="#4f8fe6"/>
		</linearGradient>
		<linearGradient id="g-deno" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="#0d6e8c"/><stop offset="1" stop-color="#5ecbe6"/>
		</linearGradient>
		<linearGradient id="g-bun" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="#1d7a3c"/><stop offset="1" stop-color="#45b56c"/>
		</linearGradient>
	</defs>
	<rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

	<text x="0" y="16" fill="#4a5568" font-size="13" font-weight="700" font-family="sans-serif">中央値 (ms) — 短いほど速い　■ 青=Node.js 26　■ 水色=Deno　■ 緑=Bun</text>

	<g font-family="sans-serif">
		<text x="0" y="52" fill="#1c2330" font-size="13" font-weight="600">B-01 空スクリプト起動</text>
		<rect x="160" y="42" width="203" height="20" rx="4" fill="url(#g-node)"/><text x="369" y="57" font-size="12" fill="#1c2330">101.3</text>
		<rect x="160" y="66" width="224" height="20" rx="4" fill="url(#g-deno)"/><text x="390" y="81" font-size="12" fill="#1c2330">111.8</text>
		<rect x="160" y="90" width="83" height="20" rx="4" fill="url(#g-bun)"/><text x="249" y="105" font-size="12" fill="#1c2330" font-weight="700">41.7</text>

		<text x="0" y="142" fill="#1c2330" font-size="13" font-weight="600">B-02 依存込み起動</text>
		<rect x="160" y="132" width="372" height="20" rx="4" fill="url(#g-node)"/><text x="538" y="147" font-size="12" fill="#1c2330">186.1</text>
		<rect x="160" y="156" width="400" height="20" rx="4" fill="url(#g-deno)"/><text x="566" y="171" font-size="12" fill="#1c2330">199.9</text>
		<rect x="160" y="180" width="134" height="20" rx="4" fill="url(#g-bun)"/><text x="300" y="195" font-size="12" fill="#1c2330" font-weight="700">66.9</text>

		<text x="0" y="232" fill="#1c2330" font-size="13" font-weight="600">B-09 TypeScript 実行</text>
		<rect x="160" y="222" width="448" height="20" rx="4" fill="url(#g-node)"/><text x="614" y="237" font-size="12" fill="#1c2330">224.0</text>
		<rect x="160" y="246" width="358" height="20" rx="4" fill="url(#g-deno)"/><text x="524" y="261" font-size="12" fill="#1c2330">178.8</text>
		<rect x="160" y="270" width="200" height="20" rx="4" fill="url(#g-bun)"/><text x="366" y="285" font-size="12" fill="#1c2330" font-weight="700">99.9</text>

		<text x="0" y="322" fill="#1c2330" font-size="13" font-weight="600">B-11 テスト 200 件</text>
		<rect x="160" y="312" width="605" height="20" rx="4" fill="url(#g-node)"/><text x="771" y="327" font-size="12" fill="#1c2330">302.5</text>
		<rect x="160" y="336" width="483" height="20" rx="4" fill="url(#g-deno)"/><text x="649" y="351" font-size="12" fill="#1c2330">241.3</text>
		<rect x="160" y="360" width="154" height="20" rx="4" fill="url(#g-bun)"/><text x="320" y="375" font-size="12" fill="#1c2330" font-weight="700">76.8</text>
