<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="検証の実施フロー図">
		<defs>
			<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
				<stop offset="0" stop-color="hsl(93.3,78%,25%)"/>
				<stop offset="1" stop-color="hsl(93.3,58%,65%)"/>
			</linearGradient>
			<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
				<path d="M 0 0 L 10 5 L 0 10 z" fill="hsl(93.3,78%,25%)"/>
			</marker>
		</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

		<rect x="14" y="40" width="150" height="64" rx="10" fill="url(#i1)"/>
		<text x="89" y="68" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1. 環境整備</text>
		<text x="89" y="88" text-anchor="middle" fill="#fff" font-size="11.5">3 ランタイムを最新化</text>

