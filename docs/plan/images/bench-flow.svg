		<text x="617" y="68" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">4. 本計測</text>
		<text x="617" y="88" text-anchor="middle" fill="#fff" font-size="11.5">全項目を直列実行</text>

		<rect x="718" y="40" width="150" height="64" rx="10" fill="url(#i1)"/>
		<text x="793" y="68" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">5. 集計</text>
