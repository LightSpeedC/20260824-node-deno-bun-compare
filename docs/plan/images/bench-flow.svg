		<text x="265" y="68" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2. 実装</text>
		<text x="265" y="88" text-anchor="middle" fill="#fff" font-size="11.5">計測用コードを用意</text>

		<rect x="366" y="40" width="150" height="64" rx="10" fill="url(#i1)"/>
		<text x="441" y="68" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">3. 予備計測</text>
