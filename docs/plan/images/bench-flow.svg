		<line x1="342" y1="72" x2="364" y2="72" stroke="hsl(93.3,78%,25%)" stroke-width="2.5" marker-end="url(#i2)"/>
		<line x1="518" y1="72" x2="540" y2="72" stroke="hsl(93.3,78%,25%)" stroke-width="2.5" marker-end="url(#i2)"/>
		<line x1="694" y1="72" x2="716" y2="72" stroke="hsl(93.3,78%,25%)" stroke-width="2.5" marker-end="url(#i2)"/>

		<path d="M 793 108 L 793 130 L 441 130 L 441 110" fill="none" stroke="hsl(93.3,58%,65%)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#i2)"/>
		<text x="617" y="146" text-anchor="middle" fill="hsl(93.3,78%,25%)" font-size="11.5">ばらつきが大きい項目は条件を見直して再計測</text>
